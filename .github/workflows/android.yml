name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # v3 still requests the removed `tools` package and fails with:
      # "Failed to find package 'tools'". v4 installs cmdline-tools + platform-tools
      # and skips the obsolete tools package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Secret must be the base64 encoding of app/google-services.json
      # (same format produced by encode-google-services.ps1).
      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON is empty or not set. Add the base64-encoded google-services.json (see encode-google-services.ps1)."
            exit 1
          fi
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          if [ ! -s app/google-services.json ]; then
            echo "::error::Failed to decode GOOGLE_SERVICES_JSON into app/google-services.json (empty output)."
            exit 1
          fi
          python3 -c "import json; json.load(open('app/google-services.json'))" \
            || { echo "::error::Decoded google-services.json is not valid JSON."; exit 1; }

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon test
